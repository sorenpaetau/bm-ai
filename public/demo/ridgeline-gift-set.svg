<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <!-- Illustration of a fictional Ridgeline Cellars three-bottle wooden gift box, drawn for the demo page. -->
  <defs>
    <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c8925a"/>
      <stop offset="1" stop-color="#8c5a2e"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0" x2="1">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#a56e3c"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" x2="1">
      <stop offset="0" stop-color="#0d0b09"/>
      <stop offset="0.35" stop-color="#4a3f38"/>
      <stop offset="1" stop-color="#060504"/>
    </linearGradient>
    <linearGradient id="foilRed" x1="0" x2="1">
      <stop offset="0" stop-color="#2e0b14"/><stop offset="0.4" stop-color="#9b3a50"/><stop offset="1" stop-color="#2a0a12"/>
    </linearGradient>
    <linearGradient id="foilGold" x1="0" x2="1">
      <stop offset="0" stop-color="#6e5418"/><stop offset="0.4" stop-color="#f1d98a"/><stop offset="1" stop-color="#6e5418"/>
    </linearGradient>
    <linearGradient id="foilBlack" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a0a"/><stop offset="0.4" stop-color="#474747"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- bottle necks rising out of the box -->
  <g>
    <path d="M58 30h22v110H58z" fill="url(#neck)"/><path d="M57 26h24v58H57z" fill="url(#foilRed)"/>
    <path d="M109 14h22v126h-22z" fill="url(#neck)"/><path d="M108 10h24v58h-24z" fill="url(#foilBlack)"/>
    <path d="M160 30h22v110h-22z" fill="url(#neck)"/><path d="M159 26h24v58h-24z" fill="url(#foilGold)"/>
  </g>
  <!-- box -->
  <path d="M22 118h196l-8 14H30z" fill="#6e421c"/>
  <rect x="24" y="128" width="192" height="150" rx="6" fill="url(#wood)"/>
  <rect x="24" y="128" width="12" height="150" rx="4" fill="url(#woodSide)" opacity="0.6"/>
  <g stroke="#6e421c" stroke-opacity="0.28" fill="none" stroke-width="1.2">
    <path d="M40 150c40 6 90-4 170 4"/><path d="M40 182c50-6 100 6 170-2"/><path d="M40 214c60 4 110-6 170 2"/><path d="M40 246c40-4 120 6 170-2"/>
  </g>
  <!-- ribbon -->
  <rect x="24" y="182" width="192" height="16" fill="#5b1a2b"/>
  <rect x="24" y="185" width="192" height="2" fill="#c9a227" opacity="0.7"/>
  <!-- branded plaque -->
  <rect x="78" y="214" width="84" height="40" rx="4" fill="#f6f1e6" stroke="#c9a227" stroke-width="1.2"/>
  <text x="120" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1218">Ridgeline</text>
  <text x="120" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="6" letter-spacing="2" fill="#8a6a22">GIFT COLLECTION</text>
  <!-- tap sticker on the box -->
  <g transform="translate(190 158)">
    <circle r="12" fill="#fff"/><circle r="10.2" fill="#14213d"/>
    <g fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round">
      <path d="M-4.4 -1.8 Q-3.4 0 -4.4 1.8"/><path d="M-1.9 -3.2 Q-0.2 0 -1.9 3.2"/><path d="M0.6 -4.6 Q3.2 0 0.6 4.6"/><path d="M3.2 -6 Q6.6 0 3.2 6"/>
    </g>
  </g>
</svg>
