<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Illustration of the fictional Ridgeline Cellars estate at golden hour, drawn for the demo page. -->
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f3c98b"/>
      <stop offset="0.55" stop-color="#f7e2bf"/>
      <stop offset="1" stop-color="#efe3cf"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9a8a9c"/><stop offset="1" stop-color="#b9a9a8"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7d8a4e"/><stop offset="1" stop-color="#5f6e36"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a6a2e"/><stop offset="1" stop-color="#3e4a1e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="470" cy="110" r="46" fill="#fbe2a6"/>
  <circle cx="470" cy="110" r="70" fill="#fbe2a6" opacity="0.35"/>
  <path d="M0 170 C90 120 170 150 250 128 S420 90 520 120 S610 140 640 132 V360 H0Z" fill="url(#hillFar)" opacity="0.8"/>
  <path d="M0 214 C110 176 210 206 320 182 S520 150 640 176 V360 H0Z" fill="url(#hillMid)"/>
  <!-- vine rows on the middle hill -->
  <g stroke="#3e4a1e" stroke-opacity="0.45" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M330 196 C380 186 450 176 520 178"/><path d="M320 210 C380 200 460 190 560 192"/><path d="M300 226 C380 214 470 206 610 208"/><path d="M280 242 C380 230 480 222 640 226"/>
  </g>
  <!-- winery building -->
  <g transform="translate(150 166)">
    <path d="M0 40 L50 8 L100 40Z" fill="#7a2438"/>
    <rect x="6" y="40" width="88" height="44" fill="#efe3cf"/>
    <rect x="40" y="56" width="20" height="28" rx="10" fill="#5b1a2b"/>
    <rect x="16" y="52" width="14" height="14" fill="#8a6a22" opacity="0.6"/>
    <rect x="70" y="52" width="14" height="14" fill="#8a6a22" opacity="0.6"/>
    <rect x="100" y="56" width="40" height="28" fill="#e2d4bd"/>
    <path d="M96 56 L120 40 L144 56Z" fill="#5b1a2b"/>
  </g>
  <g fill="#3e4a1e"><ellipse cx="128" cy="244" rx="16" ry="30"/><ellipse cx="312" cy="250" rx="13" ry="26"/></g>
  <path d="M0 270 C140 232 280 262 400 246 S560 226 640 240 V360 H0Z" fill="url(#hillNear)"/>
  <!-- near vine rows in perspective -->
  <g stroke="#2c3612" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M40 360 C120 300 200 276 300 262"/><path d="M150 360 C210 306 280 282 360 262"/><path d="M270 360 C310 310 360 286 420 256"/><path d="M400 360 C420 312 450 286 480 252"/><path d="M530 360 C530 318 535 290 540 246"/><path d="M640 352 C620 316 610 290 600 244"/>
  </g>
  <g fill="#5b1a2b" opacity="0.8">
    <circle cx="96" cy="320" r="4"/><circle cx="104" cy="326" r="4"/><circle cx="98" cy="330" r="4"/>
    <circle cx="228" cy="320" r="4"/><circle cx="236" cy="326" r="4"/>
    <circle cx="444" cy="318" r="4"/><circle cx="450" cy="326" r="4"/><circle cx="440" cy="326" r="4"/>
  </g>
</svg>
